name: Audit connections and package source
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-connections.yml, tools/audit_connections.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check reciprocal source links
        run: python tools/audit_connections.py
      - name: Preserve the audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reciprocal-links.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified reciprocal links to all related source projects'
            git pull --rebase origin main
            git push
          fi
      - name: Complete source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mutual-futures-source
          include-hidden-files: true
          path: |
            .github
            .gitignore
            README.md
            ABOUT.md
            LICENCE.md
            repository-metadata.json
            assets
            content
            tools
            docs
            site
          retention-days: 30
