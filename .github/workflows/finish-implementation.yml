name: Finish checked implementation
on:
  push:
    branches: [main]
    paths: [.github/workflows/finish-implementation.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  finish:
    if: github.repository == 'auraofintelligence/mutual-futures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the tested keyboard correction and remove an unused renderer assignment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/app.js');s=p.read_text()
          old="close.addEventListener('click',()=>dialog.close());dialog.addEventListener('close',tidy);"
          new=old+"\n    dialog.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();dialog.close();}});"
          if "dialog.addEventListener('keydown'" not in s:
              assert old in s
              p.write_text(s.replace(old,new))
          p=Path('tools/build.py');lines=p.read_text().splitlines()
          p.write_text('\n'.join(line for line in lines if not line.startswith(" h=f'<section class=") and 'second half above must be interpolated' not in line)+'\n')
          PY
      - name: Rebuild and verify
        run: |
          python tools/build.py
          python tools/check.py
          node --check assets/app.js
      - name: Commit the checked correction and metadata record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/finish-implementation.yml
          git add assets/app.js tools/build.py site repository-metadata.json .github/workflows/finish-implementation.yml
          git commit -m 'Apply tested Escape-key behaviour and preserve repository metadata'
          git pull --rebase origin main
          git push
      - name: Run the normal publishing workflow on the corrected source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/auraofintelligence/mutual-futures/actions/workflows/publish.yml/dispatches -f ref=main
