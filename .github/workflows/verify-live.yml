name: Verify the public site

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-live.yml', 'tools/verify_live.py']
  workflow_run:
    workflows: ['Build, check and publish Mutual Futures', 'pages build and deployment']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutual-futures-live-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify exact public HTML, assets and library downloads
        id: public_check
        continue-on-error: true
        run: python tools/verify_live.py
      - name: Verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutual-futures-live-check
          path: docs/live-check.json
          if-no-files-found: error
      - name: Public verification summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('docs/live-check.json')
          if not p.exists():
              raise SystemExit('The verification script did not produce a report.')
          report = json.loads(p.read_text())
          rows = report['results']
          passed = sum(bool(r.get('passed')) for r in rows)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## Public site verification\n\n{passed}/{len(rows)} public URLs match the checked build exactly.\n\n")
              summary.write(f"Checked: {report['checked_at_utc']}\n\n")
              for r in rows:
                  if not r.get('passed'):
                      summary.write(f"- Failed: `{r['path']}` ({r['status']})\n")
          if not report['passed']:
              raise SystemExit('The public site differs from the checked build. See the saved report.')
          PY
