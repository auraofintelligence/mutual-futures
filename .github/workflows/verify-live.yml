name: Verify the public site
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-live.yml, tools/verify_live.py]
  workflow_run:
    workflows: ['Build, check and publish Mutual Futures']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual public HTML, assets and library downloads
        run: python tools/verify_live.py
      - name: Commit the actual verification result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/live-check.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record actual public Pages verification and current publishing status'
            git pull --rebase origin main
            git push
          fi
      - name: Verification record
        uses: actions/upload-artifact@v4
        with:
          name: mutual-futures-live-check
          path: docs/live-check.json
      - name: Report any failed public check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('docs/live-check.json').read_text())
          if not report['passed']:raise SystemExit('Some public checks failed. The individual requests are recorded in docs/live-check.json.')
          PY
